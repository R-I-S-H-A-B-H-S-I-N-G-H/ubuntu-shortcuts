version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: indian@123   # root password
      MYSQL_DATABASE: appdb                  # initial database
      MYSQL_USER: appuser                    # non-root user
      MYSQL_PASSWORD: appuserpass            # non-root user's password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # persist data locally

volumes:
  mysql_data:
